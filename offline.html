<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A585D">
<title>آفلاین | هم‌سفر</title>
<link rel="icon" href="icons/icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#F1F6F5;--ink:#0E2A2D;--ink2:#456266;--accent:#0B7A7F}
@media (prefers-color-scheme:dark){:root{--bg:#0B1A1C;--ink:#E4F0EF;--ink2:#9AB6B8;--accent:#38BDBF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 16px/1.9 Vazirmatn,Tahoma,system-ui,sans-serif;text-align:center}
main{max-width:360px;display:grid;gap:14px;justify-items:center}
img{width:96px;height:96px;border-radius:22px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--ink2)}
button{border:0;border-radius:12px;padding:12px 28px;background:var(--accent);color:#fff;font:inherit;min-height:48px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#04282A}}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="" width="96" height="96">
  <h1>اینترنت وصل نیست</h1>
  <p>هم‌سفر برای دیدن سفرها و ثبت درخواست‌ها به اینترنت نیاز دارد. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
  <button type="button" onclick="location.href='./index.html'">تلاش دوباره</button>
</main>
<script>window.addEventListener('online',function(){location.href='./index.html'})</script>
</body>
</html>
